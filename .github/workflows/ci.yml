name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Core integration tests
        run: node test/integration.mjs

      - name: ACP tests
        run: node test/acp.test.mjs

      - name: Middleware tests
        run: node test/middleware.test.mjs

      - name: x402 facilitator tests
        run: node test/x402.test.mjs

      - name: CJS import tests
        run: node test/cjs-import.test.cjs

      - name: Passport tests
        run: node test/passport.test.mjs

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      - name: TypeScript strict build
        run: npx tsc --noEmit
